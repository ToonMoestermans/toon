<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Portfolio</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg: #000000;          /* page colour */
      --tile: #000000;         /* colour shown while an image loads */
      --radius: 2px;          /* corner rounding of the images */
      --backdrop: rgba(239, 238, 233, 0.86);
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      overscroll-behavior: none;
    }

    *, *::before, *::after { touch-action: none; }

    body {
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    body.ready { opacity: 1; }
    body.dragging, body.dragging * { cursor: grabbing !important; }

    /* ---------- infinite grid ---------- */

    #world {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    .tile {
      position: absolute;
      left: 0;
      top: 0;
      background: var(--tile);
      border-radius: var(--radius);
      overflow: hidden;
      will-change: transform;
      contain: layout paint;
      cursor: pointer;
    }
    body.dragging .tile { cursor: grabbing; }

    .tile img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
    .tile img.loaded { opacity: 1; }
    .tile.hidden { visibility: hidden; }

    /* ---------- enlarged view ---------- */

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }
    #overlay.active { pointer-events: auto; cursor: zoom-out; }

    #backdrop {
      position: absolute;
      inset: 0;
      background: transparent;
      -webkit-backdrop-filter: blur(0px);
      backdrop-filter: blur(0px);
      transition: background-color 0.45s ease, -webkit-backdrop-filter 0.45s ease, backdrop-filter 0.45s ease;
    }
    #overlay.open #backdrop {
      background: var(--backdrop);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
    }

    .card {
      position: absolute;
      transform-origin: 50% 50%;
      border-radius: var(--radius);
      overflow: hidden;
      will-change: transform;
      cursor: grab;
      background: var(--tile);
    }
    .card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }
    .card .glare {
      position: absolute;
      inset: 0;
      pointer-events: none;
      mix-blend-mode: soft-light;
      opacity: 0;
    }
  </style>
</head>
<body>
  <div id="world"></div>
  <div id="overlay"><div id="backdrop"></div></div>

  <script>
    (() => {
      'use strict';

      // ---------------------------------------------------------------- settings
      const FRICTION = 3.4;          // how quickly a flung grid slows down (higher = sooner)
      const MAX_FLING = 4500;        // px/s cap on grid fling speed
      const CLOSE_FLICK = 1400;      // px/s — flick the enlarged image this fast to close it
      const CLOSE_DIST = 0.32;       // …or drag it this far (fraction of the screen)
      const TOUCH_TILT = 1.6;        // phones: how strongly the card tips where you press it

      // Every image in the images/ folder is shown — just add or remove files there.
      // On GitHub Pages the list of files is read from GitHub; when previewing on your
      // computer it's read from the folder. Only needed with a custom domain (your own
      // web address): fill in your GitHub username and repository name.
      const IMAGE_FOLDER = 'images';
      const GITHUB_USER = '';
      const GITHUB_REPO = '';

      // Only used when you open index.html by double-clicking it: the browser then
      // isn't allowed to look inside the images folder, so it uses this list instead.
      // Online it isn't needed. Add a name here if you want to see a new image offline.
      const IMAGES = [
        '2luik.jpg',
        'apl.jpg',
        'Artboard2.jpg',
        'bocheltje2.jpg',
        'bonk.jpg',
        'cat swirl.jpg',
        'drawing3.webp',
        'elek cat.jpg',
        'entangled 2.webp',
        'face.jpg',
        'migraine.webp',
        'snail.jpg',
        'snakeaplle.jpg',
        'sterrenmannetje.jpg',
        'tie.jpg',
      ];

      const world = document.getElementById('world');
      const overlay = document.getElementById('overlay');
      const body = document.body;

      // ---------------------------------------------------------------- helpers
      const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
      const mod = (a, n) => ((a % n) + n) % n;
      const now = () => performance.now();
      // size of the page itself — unlike innerWidth it stays the same if the phone zooms in
      const VW = () => document.documentElement.clientWidth || window.innerWidth;
      const VH = () => document.documentElement.clientHeight || window.innerHeight;

      function mulberry32(a) {
        return () => {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      function shuffle(arr, rand) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(rand() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      // Tracks pointer positions over the last ~100 ms to estimate velocity (px/s).
      class Velocity {
        constructor() { this.s = []; }
        reset() { this.s.length = 0; }
        add(x, y) {
          const t = now();
          this.s.push({ x, y, t });
          while (this.s.length > 2 && t - this.s[0].t > 100) this.s.shift();
        }
        get() {
          const s = this.s;
          if (s.length < 2) return { x: 0, y: 0 };
          const a = s[0], b = s[s.length - 1];
          if (now() - b.t > 70) return { x: 0, y: 0 }; // pointer has been held still
          const dt = Math.max(0.008, (b.t - a.t) / 1000);
          return { x: (b.x - a.x) / dt, y: (b.y - a.y) / dt };
        }
      }

      // ---------------------------------------------------------------- images
      let IMGS = []; // { url, ar }

      const IMAGE_EXT = /\.(jpe?g|png|gif|webp|avif)$/i;

      async function listImages() {
        if (location.protocol === 'file:') return IMAGES; // opened by double-click
        // 1. GitHub Pages: ask GitHub which files are in the folder (cached for 10 min)
        let user = GITHUB_USER, repo = GITHUB_REPO;
        const host = location.hostname;
        if (!user && host.endsWith('.github.io')) {
          user = host.split('.')[0];
          const first = location.pathname.split('/').filter(Boolean)[0];
          repo = first && !first.includes('.') ? first : host;
        }
        if (user && repo) {
          const cacheKey = `imgs:${user}/${repo}`;
          try {
            const c = JSON.parse(sessionStorage.getItem(cacheKey) || 'null');
            if (c && Date.now() - c.t < 600000) return c.names;
          } catch (_) {}
          try {
            const r = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${IMAGE_FOLDER}`);
            if (r.ok) {
              const names = (await r.json())
                .filter((f) => f.type === 'file' && IMAGE_EXT.test(f.name)).map((f) => f.name);
              try { sessionStorage.setItem(cacheKey, JSON.stringify({ t: Date.now(), names })); } catch (_) {}
              if (names.length) return names;
            }
          } catch (_) {}
        }
        // 2. Local preview: read the folder listing the preview server shows
        try {
          const r = await fetch(IMAGE_FOLDER + '/');
          if (r.ok) {
            const doc = new DOMParser().parseFromString(await r.text(), 'text/html');
            const names = [...doc.querySelectorAll('a[href]')]
              .map((a) => decodeURIComponent(a.getAttribute('href').split('/').pop()))
              .filter((n) => IMAGE_EXT.test(n));
            if (names.length) return [...new Set(names)];
          }
        } catch (_) {}
        return IMAGES;
      }

      // load every image once to learn its proportions
      async function loadImages() {
        const names = await listImages();
        const list = await Promise.all(names.map((name) => new Promise((res) => {
          const url = IMAGE_FOLDER + '/' + encodeURIComponent(name);
          const im = new Image();
          im.onload = () => res({ url, ar: im.naturalWidth / im.naturalHeight });
          im.onerror = () => res(null);
          im.src = url;
        })));
        return list.filter(Boolean);
      }

      // ---------------------------------------------------------------- layout
      // Images are scattered over one big rectangle that repeats endlessly in every
      // direction. Nothing overlaps (also across the edges where it repeats), and the
      // same image is never placed close to itself.
      const SPREAD = 0.4;             // how much of the page is covered (0.25 = airy, 0.45 = full)
      const GAP = 0.12;               // least space between images, relative to the image size
      const seed = Math.floor(Math.random() * 1e9);
      let TW = 1, TH = 1, maxSide = 0, items = [];

      function layout() {
        if (!IMGS.length) return; // images not loaded yet
        const vw = VW(), vh = Math.max(VH(), screen.height || 0);
        layoutW = vw;
        const base = vw < 640 ? vw * 0.42 : clamp(vw / 6.5, 150, 320); // normal image width
        const pad = base * GAP;
        const rand = mulberry32(seed);
        const n = IMGS.length;
        const avgArea = base * base * 0.85;
        // every image covers the same surface, whatever its shape
        const sizeOf = (i) => {
          const ar = clamp(IMGS[i].ar, 0.25, 4);
          return { w: Math.sqrt(avgArea * ar), h: Math.sqrt(avgArea / ar) };
        };

        // big enough that a repeat is never on screen twice and every image fits once
        const area = Math.max(vw * 1.8 * vh * 1.8, (n * avgArea) / SPREAD);
        TW = Math.max(Math.sqrt(area * (vw / vh)), vw * 1.8);
        TH = Math.max(area / TW, vh * 1.8);
        const target = Math.max(n, Math.round((TW * TH * SPREAD) / avgArea));

        items = [];
        const fits = (cx, cy, w, h, idx, near) => {
          for (const it of items) {
            const dx = Math.abs(mod(it.cx - cx + TW / 2, TW) - TW / 2);
            const dy = Math.abs(mod(it.cy - cy + TH / 2, TH) - TH / 2);
            if (dx < (w + it.w) / 2 + pad && dy < (h + it.h) / 2 + pad) return false;
            if (it.idx === idx && Math.hypot(dx, dy) < near) return false;
          }
          return true;
        };
        let bag = [], misses = 0;
        while (items.length < target && misses < 40) {
          if (!bag.length) bag = shuffle(IMGS.map((_, i) => i), rand);
          const idx = bag.pop();
          const { w, h } = sizeOf(idx);
          let placed = false;
          for (let t = 0; t < 500 && !placed; t++) {
            // try random spots; later attempts may sit a bit closer to its own copies
            const cx = rand() * TW, cy = rand() * TH;
            if (fits(cx, cy, w, h, idx, t < 300 ? base * 3 : base * 1.3)) {
              items.push({ idx, cx, cy, w, h, x: cx - w / 2, y: cy - h / 2 });
              placed = true;
            }
          }
          misses = placed ? 0 : misses + 1;
        }
        maxSide = Math.max(0, ...items.map((it) => Math.max(it.w, it.h)));

        // drop every live tile so it is rebuilt with the new sizes
        for (const el of active.values()) release(el);
        active.clear();
        dirty = true;
      }

      // ---------------------------------------------------------------- rendering
      const cam = { x: 0, y: 0 };
      let camVel = { x: 0, y: 0 };
      let dirty = true;
      let frame = 0;
      const active = new Map(); // key -> element
      const pool = [];

      function acquire(item, key) {
        let el = pool.pop();
        if (!el) {
          el = document.createElement('div');
          el.className = 'tile';
          const img = document.createElement('img');
          img.alt = '';
          img.draggable = false;
          img.decoding = 'async';
          img.addEventListener('load', () => img.classList.add('loaded'));
          el.appendChild(img);
          world.appendChild(el);
        }
        const img = el.firstChild;
        const url = IMGS[item.idx].url;
        if (el._url !== url) {
          img.classList.remove('loaded');
          img.src = url;
          el._url = url;
          if (img.complete && img.naturalWidth) img.classList.add('loaded');
        }
        el._idx = item.idx;
        el._key = key;
        el.classList.remove('hidden');
        el.style.width = item.w + 'px';
        el.style.height = item.h + 'px';
        el.style.display = '';
        return el;
      }
      function release(el) {
        el.style.display = 'none';
        el._key = null;
        el.classList.remove('hidden');
        pool.push(el);
      }

      function render() {
        frame++;
        const vw = VW(), vh = VH(), m = 160, M = m + maxSide;
        const ix0 = Math.floor((cam.x - M) / TW), ix1 = Math.floor((cam.x + vw + M) / TW);
        const iy0 = Math.floor((cam.y - M) / TH), iy1 = Math.floor((cam.y + vh + M) / TH);
        for (let ix = ix0; ix <= ix1; ix++) {
          for (let iy = iy0; iy <= iy1; iy++) {
            for (let i = 0; i < items.length; i++) {
              const it = items[i];
              const x = ix * TW + it.x, y = iy * TH + it.y;
              if (x + it.w < cam.x - m || x > cam.x + vw + m || y + it.h < cam.y - m || y > cam.y + vh + m) continue;
              const key = ix + '|' + iy + '|' + i;
              let el = active.get(key);
              if (!el) { el = acquire(it, key); active.set(key, el); }
              el._frame = frame;
              el.style.transform = `translate3d(${x - cam.x}px,${y - cam.y}px,0)`;
            }
          }
        }
        for (const [key, el] of active) {
          if (el._frame !== frame) { release(el); active.delete(key); }
        }
      }

      // ---------------------------------------------------------------- drag / scroll input
      const gridVel = new Velocity();
      let g = null; // current grid drag

      world.addEventListener('pointerdown', (e) => {
        if (card || g) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        const wasMoving = Math.hypot(camVel.x, camVel.y) > 80;
        g = {
          id: e.pointerId, sx: e.clientX, sy: e.clientY, cx: cam.x, cy: cam.y, moved: 0,
          tile: wasMoving ? null : e.target.closest('.tile'),
        };
        camVel = { x: 0, y: 0 };
        gridVel.reset();
        gridVel.add(cam.x, cam.y);
        try { world.setPointerCapture(e.pointerId); } catch (_) {}
      });
      world.addEventListener('pointermove', (e) => {
        if (!g || e.pointerId !== g.id) return;
        const dx = e.clientX - g.sx, dy = e.clientY - g.sy;
        g.moved = Math.max(g.moved, Math.hypot(dx, dy));
        if (g.moved > 4) body.classList.add('dragging');
        cam.x = g.cx - dx;
        cam.y = g.cy - dy;
        gridVel.add(cam.x, cam.y);
        dirty = true;
      });
      function endGrid(e, cancelled) {
        if (!g || e.pointerId !== g.id) return;
        body.classList.remove('dragging');
        const v = gridVel.get();
        const sp = Math.hypot(v.x, v.y);
        const f = sp > MAX_FLING ? MAX_FLING / sp : 1;
        camVel = { x: v.x * f, y: v.y * f };
        const tapSlop = e.pointerType === 'mouse' ? 6 : 12;
        if (!cancelled && g.moved < tapSlop && g.tile) openCard(g.tile);
        g = null;
      }
      world.addEventListener('pointerup', (e) => endGrid(e, false));
      world.addEventListener('pointercancel', (e) => endGrid(e, true));

      addEventListener('wheel', (e) => {
        e.preventDefault();
        if (card) return;
        const m = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? VH() : 1;
        cam.x += e.deltaX * m;
        cam.y += e.deltaY * m;
        camVel = { x: 0, y: 0 };
        dirty = true;
      }, { passive: false });

      addEventListener('keydown', (e) => {
        if (e.key === 'Escape') return closeCard();
        if (card) return;
        const push = 900;
        if (e.key === 'ArrowLeft') camVel.x -= push;
        else if (e.key === 'ArrowRight') camVel.x += push;
        else if (e.key === 'ArrowUp') camVel.y -= push;
        else if (e.key === 'ArrowDown') camVel.y += push;
      });

      // ---------------------------------------------------------------- enlarged card
      let card = null;
      const cardVel = new Velocity();

      function tileGeom(r) {
        return {
          x: r.left + r.width / 2 - VW() / 2,
          y: r.top + r.height / 2 - VH() / 2,
          s: r.width / card.W,
        };
      }
      function setCardGeometry() {
        const vw = VW(), vh = VH(), small = vw < 640;
        const mw = vw * (small ? 0.88 : 0.78), mh = vh * (small ? 0.72 : 0.82);
        let W = mw, H = W / card.ar;
        if (H > mh) { H = mh; W = H * card.ar; }
        card.W = W; card.H = H;
        Object.assign(card.el.style, {
          width: W + 'px', height: H + 'px',
          left: (vw - W) / 2 + 'px', top: (vh - H) / 2 + 'px',
        });
      }

      function openCard(tile) {
        const item = IMGS[tile._idx];
        const el = document.createElement('div');
        el.className = 'card';
        const img = document.createElement('img');
        img.src = item.url; img.alt = ''; img.draggable = false;
        const glare = document.createElement('div');
        glare.className = 'glare';
        el.append(img, glare);
        overlay.appendChild(el);

        card = {
          el, glare, tile, key: tile._key, ar: item.ar,
          x: 0, y: 0, s: 1, vx: 0, vy: 0, vs: 0,
          tx: 0, ty: 0, ts: 1, K: 210, D: 21,
          rx: 0, ry: 0, rz: 0, hx: 0, hy: 0, lift: 0,
          dragging: false, closing: false, drag: null,
        };
        setCardGeometry();
        const geo = tileGeom(tile.getBoundingClientRect());
        card.x = geo.x; card.y = geo.y; card.s = card.s0 = geo.s;
        camVel = { x: 0, y: 0 };
        overlay.classList.add('active');
        applyCard(0);

        // keep the small tile showing until the big copy is ready to paint, so the card
        // never flashes empty (big images take a moment to decode on phones)
        const c = card;
        c.waiting = true;
        el.style.visibility = 'hidden';
        const show = () => {
          if (card !== c || !c.waiting) return;
          c.waiting = false;
          el.style.visibility = '';
          tile.classList.add('hidden');
          overlay.classList.add('open');
        };
        (img.decode ? img.decode() : Promise.resolve()).then(show, show);
        setTimeout(show, 400);
      }

      function closeCard() {
        if (!card || card.closing) return;
        const c = card;
        if (c.waiting) { // closed before it even appeared
          c.el.remove(); overlay.classList.remove('active'); card = null; return;
        }
        c.closing = true;
        c.dragging = false;
        c.hx = c.hy = 0;
        body.classList.remove('dragging');
        overlay.classList.remove('open');
        const t = c.tile;
        if (t.isConnected && t._key === c.key && t.style.display !== 'none') {
          const geo = tileGeom(t.getBoundingClientRect());
          c.tx = geo.x; c.ty = geo.y; c.ts = geo.s;
          c.K = 240; c.D = 31;
          const sp = Math.hypot(c.vx, c.vy);
          if (sp > 2600) { c.vx *= 2600 / sp; c.vy *= 2600 / sp; }
        } else {
          // the original tile is gone (e.g. after a resize) — just fade away
          c.tx = c.x; c.ty = c.y + 30; c.ts = c.s * 0.92;
          c.el.style.transition = 'opacity 0.35s ease';
          c.el.style.opacity = '0';
          c.fade = true;
        }
      }

      function finishClose() {
        const c = card;
        if (c.tile._key === c.key) c.tile.classList.remove('hidden');
        c.el.remove();
        overlay.classList.remove('active');
        card = null;
      }

      // point on the card (-1..1 from the centre) → that side tips away, like pressing on it
      function pressTilt(c, e) {
        const hw = (c.W * c.s) / 2, hh = (c.H * c.s) / 2;
        const nx = (e.clientX - (VW() / 2 + c.x)) / hw;
        const ny = (e.clientY - (VH() / 2 + c.y)) / hh;
        return { nx, ny };
      }

      overlay.addEventListener('pointerdown', (e) => {
        if (!card || card.closing) return;
        const c = card;
        if (e.target.closest('.card')) {
          c.dragging = true;
          c.ts = 1.04;
          c.drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, ox: c.x, oy: c.y,
            touch: e.pointerType !== 'mouse' };
          if (c.drag.touch) {
            // on a phone there is no hover: the card tips towards where the finger presses
            const { nx, ny } = pressTilt(c, e);
            c.hx = clamp(nx, -1, 1) * TOUCH_TILT;
            c.hy = clamp(ny, -1, 1) * TOUCH_TILT;
          }
          cardVel.reset();
          cardVel.add(c.x, c.y);
          try { c.el.setPointerCapture(e.pointerId); } catch (_) {}
          body.classList.add('dragging');
        } else {
          c.backdrop = { id: e.pointerId, x: e.clientX, y: e.clientY };
        }
      });
      overlay.addEventListener('pointermove', (e) => {
        if (!card) return;
        const c = card;
        if (c.dragging && e.pointerId === c.drag.id) {
          c.x = c.drag.ox + (e.clientX - c.drag.sx);
          c.y = c.drag.oy + (e.clientY - c.drag.sy);
          cardVel.add(c.x, c.y);
        } else if (!c.closing && e.pointerType === 'mouse') {
          // subtle tilt towards the cursor
          const { nx, ny } = pressTilt(c, e);
          const inside = Math.abs(nx) <= 1.15 && Math.abs(ny) <= 1.15;
          c.hx = inside ? clamp(nx, -1, 1) : 0;
          c.hy = inside ? clamp(ny, -1, 1) : 0;
        }
      });
      function endCard(e) {
        if (!card) return;
        const c = card;
        if (c.dragging && e.pointerId === c.drag.id) {
          c.dragging = false;
          c.ts = 1;
          if (c.drag.touch) c.hx = c.hy = 0;
          body.classList.remove('dragging');
          const v = cardVel.get();
          c.vx = v.x; c.vy = v.y;
          const speed = Math.hypot(v.x, v.y);
          const dist = Math.hypot(c.x, c.y);
          if (e.type !== 'pointercancel' &&
              (speed > CLOSE_FLICK || dist > Math.min(VW(), VH()) * CLOSE_DIST)) {
            closeCard();
          } else {
            c.tx = 0; c.ty = 0; c.K = 260; c.D = 17; // springy return
          }
        } else if (c.backdrop && e.pointerId === c.backdrop.id) {
          const moved = Math.hypot(e.clientX - c.backdrop.x, e.clientY - c.backdrop.y);
          c.backdrop = null;
          if (moved < 12 && e.type === 'pointerup') closeCard();
        }
      }
      overlay.addEventListener('pointerup', endCard);
      overlay.addEventListener('pointercancel', endCard);
      overlay.addEventListener('pointerleave', () => { if (card) card.hx = card.hy = 0; });

      function stepCard(dt) {
        const c = card;
        const steps = Math.ceil(dt / (1 / 240));
        const h = dt / steps;
        for (let i = 0; i < steps; i++) {
          if (!c.dragging) {
            c.vx += (-c.K * (c.x - c.tx) - c.D * c.vx) * h;
            c.vy += (-c.K * (c.y - c.ty) - c.D * c.vy) * h;
            c.x += c.vx * h;
            c.y += c.vy * h;
          }
          const KS = c.closing ? 260 : 230, DS = c.closing ? 32 : 22;
          c.vs += (-KS * (c.s - c.ts) - DS * c.vs) * h;
          c.s += c.vs * h;
        }
        if (c.dragging) { const v = cardVel.get(); c.vx = v.x; c.vy = v.y; }

        applyCard(dt);

        if (c.closing) {
          const settled = Math.abs(c.x - c.tx) < 0.6 && Math.abs(c.y - c.ty) < 0.6 &&
            Math.abs(c.s - c.ts) < 0.004 && Math.hypot(c.vx, c.vy) < 30 && Math.abs(c.vs) < 0.05;
          if (settled || (c.fade && (c.fadeT = (c.fadeT || 0) + dt) > 0.4)) finishClose();
        }
      }

      function applyCard(dt) {
        const c = card;
        // tilt from movement (like an album cover you can fling around) + from hover
        const tz = clamp(c.vx * 0.005, -12, 12);
        const ty = clamp(c.vx * 0.011, -22, 22) + c.hx * 8;
        const tx = clamp(-c.vy * 0.011, -22, 22) - c.hy * 8;
        const f = dt ? 1 - Math.exp(-dt * 11) : 1;
        c.rz += (tz - c.rz) * f;
        c.ry += (ty - c.ry) * f;
        c.rx += (tx - c.rx) * f;
        c.lift += ((c.dragging ? 1 : 0) - c.lift) * (dt ? 1 - Math.exp(-dt * 8) : 0);

        c.el.style.transform =
          `translate3d(${c.x}px,${c.y}px,0) perspective(1400px) rotateX(${c.rx}deg) rotateY(${c.ry}deg) rotateZ(${c.rz}deg) scale(${c.s})`;

        const p = c.s0 < 1 ? clamp((c.s - c.s0) / (1 - c.s0), 0, 1) : 1;
        const L = c.lift;
        c.el.style.boxShadow =
          `0 ${(10 + 26 * L) * p}px ${(36 + 60 * L) * p}px rgba(0,0,0,${(0.16 + 0.1 * L) * p})`;

        const tilt = Math.min(1, Math.hypot(c.rx, c.ry) / 18);
        c.glare.style.opacity = (tilt * p).toFixed(3);
        c.glare.style.background =
          `radial-gradient(circle at ${50 - c.ry * 2.5}% ${50 + c.rx * 2.5}%, rgba(255,255,255,0.85), rgba(255,255,255,0) 60%)`;
      }

      // ---------------------------------------------------------------- loop
      let last = now();
      function tick(t) {
        const dt = Math.min(0.05, (t - last) / 1000);
        last = t;
        if (!g && !card) {
          if (Math.abs(camVel.x) > 3 || Math.abs(camVel.y) > 3) {
            cam.x += camVel.x * dt;
            cam.y += camVel.y * dt;
            const k = Math.exp(-dt * FRICTION);
            camVel.x *= k; camVel.y *= k;
            dirty = true;
          } else camVel.x = camVel.y = 0;
        }
        if (dirty) { render(); dirty = false; }
        if (card && !card.waiting) stepCard(dt);
        requestAnimationFrame(tick);
      }

      // Phones change the window height whenever the address bar slides in or out;
      // only rebuild the layout when the width really changes (e.g. turning the phone).
      let resizeTimer, layoutW = 0;
      addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (VW() !== layoutW) layout();
          else dirty = true;
          if (card && !card.closing) setCardGeometry();
        }, 120);
      });
      // Phones: never let the browser zoom the page (double-tap or pinch).
      // Safari ignores the "no zoom" setting in the page header, so it's blocked here too.
      const noZoom = (e) => e.preventDefault();
      ['gesturestart', 'gesturechange', 'gestureend', 'dblclick'].forEach((t) =>
        document.addEventListener(t, noZoom, { passive: false }));
      document.addEventListener('touchmove', noZoom, { passive: false });
      let lastTouchEnd = 0;
      document.addEventListener('touchend', (e) => {
        const t = now();
        if (t - lastTouchEnd < 350) e.preventDefault(); // second tap of a double-tap
        lastTouchEnd = t;
      }, { passive: false });
      // if a zoom slips through anyway, snap the page back to normal size
      const meta = document.querySelector('meta[name=viewport]');
      if (window.visualViewport) visualViewport.addEventListener('resize', () => {
        if (visualViewport.scale > 1.01) {
          const c = meta.content;
          meta.content = c + ', minimum-scale=1';
          requestAnimationFrame(() => { meta.content = c; });
        }
      });

      // ---------------------------------------------------------------- start
      loadImages().then((list) => {
        IMGS = list;
        if (!IMGS.length) return;
        layout();
        cam.x = Math.random() * TW;
        cam.y = Math.random() * 4000;
        render();
        requestAnimationFrame(() => body.classList.add('ready'));
        requestAnimationFrame(tick);
      });
    })();
  </script>
</body>
</html>
